name: Build FantaPiantoAsta

on:
  push:
    tags:
      - 'v*' # Si attiva quando crei un tag come v1.0.0
  workflow_dispatch: # Ti permette di avviarlo manualmente da GitHub

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # PERMESSO RICHIESTO:
    permissions:
      contents: write # Consente la creazione di Release e il caricamento di file/tag

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npm run release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/
